app = "financial-advisor-agent"
primary_region = "den"

[build]

[env]
  PORT = "4000"
  PHX_HOST = "financial-advisor-agent.fly.dev"
  MIX_ENV = "prod"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = "/app/priv/static"
  url_prefix = "/assets"
