services:
  - type: web
    name: financial-advisor-agent
    env: elixir
    plan: starter
    buildCommand: |
      mix deps.get
      mix assets.deploy
      mix release
    startCommand: |
      _build/prod/rel/financial_advisor_agent/bin/financial_advisor_agent start
    envVars:
      - key: MIX_ENV
        value: prod
      - key: PORT
        value: 4000
      - key: PHX_HOST
        value: financial-advisor-agent.onrender.com
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financial-advisor-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: financial-advisor-agent-db
    plan: starter
    databaseName: financial_advisor_agent
    user: financial_advisor_agent
